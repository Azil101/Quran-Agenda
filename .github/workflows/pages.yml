name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/quran-app-planning-Jw5LG
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        working-directory: ./web-app
        run: npm ci

      - name: Create .env file
        working-directory: ./web-app
        run: |
          echo "VITE_FIREBASE_API_KEY=AIzaSyDldHIN5FTn3VtdOo1glaGwNzkhFKMBIfo" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=quranagenda-b3f9a.firebaseapp.com" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=quranagenda-b3f9a" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=quranagenda-b3f9a.firebasestorage.app" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=990096038405" >> .env
          echo "VITE_FIREBASE_APP_ID=1:990096038405:web:9c4211674e1cfba39eda6c" >> .env
          echo "VITE_QURAN_API_BASE_URL=https://api.quran.com/api/v4" >> .env
          echo "VITE_BASE_PATH=/Quran-Agenda/" >> .env

      - name: Build
        working-directory: ./web-app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web-app/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
